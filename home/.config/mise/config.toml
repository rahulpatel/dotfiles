[hooks]
enter = "mise i -q"

[settings]
color_theme = "catppuccin"
experimental = true
# Keep every tool below up to date (within its version request).
tool_update.global_auto = true

# Check hourly in the background via launchd instead of at shell prompts.
[bootstrap.services.mise-tool-update]
builtin = "tool-update"

[tools]
"bun" = "latest"
"node" = "lts"
"npm:@earendil-works/pi-coding-agent" = { version = "latest", npm_args = "--ignore-scripts=false" }
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
"npm:open-computer-use" = "latest"


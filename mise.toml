[settings]
dotfiles.root = "."
experimental = true
install_layout = "identity"

[vars]
git_name = { default = "Rahul Patel", prompt = "Git author name" }
git_email = { default = "rahulpatel@users.noreply.github.com", prompt = "Git author email" }
code_dir = { default = "{{ env.HOME }}/code", prompt = "Code directory" }

[tools]
ruby = "3"

[bootstrap.hooks.pre-packages]
run = "mise install ruby"

[bootstrap.packages]
"brew:fd" = "latest"
"brew:fish" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:jq" = "latest"
"brew:neovim" = "latest"
"brew:podman" = "latest"
"brew:starship" = "latest"
"brew:zoxide" = "latest"

"brew-cask:nikitabobko/tap/aerospace" = "latest"
"brew-cask:cursor" = "latest"
"brew-cask:figma" = "latest"
"brew-cask:font-fira-code" = "latest"
"brew-cask:helium-browser" = "latest"
"brew-cask:anomalyco/tap/hex" = "latest"
"brew-cask:macshot" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:abue-ammar/tinycast/tinycast" = "latest"

# Profile: personal
"brew-cask:1password" = { env = "personal" }
"brew-cask:cuadriver" = { env = "personal" }
"brew-cask:obsidian" = { env = "personal" }
"brew-cask:private-internet-access" = { env = "personal" }
"brew-cask:tailscale-app" = { env = "personal" }

# Profile: work
"brew:glab" = { env = "work" }

"brew-cask:slack" = { env = "work" }

[bootstrap.directories."~/.local/share/dotfiles"]
[bootstrap.files."~/.local/share/dotfiles/env.fish"]
template = true
content = """
# Generated by mise bootstrap; change with mise vars code_dir=...
set -gx CODE_DIR {{ vars.code_dir | regex_replace(pattern='^~(/|$)', rep=env.HOME ~ '/') | absolute | quote }}
"""

[dotfiles]
"~/.gitconfig.local" = { source = "home/.config/git/config.local.tmpl", mode = "template" }

[dotfile_groups.agents]
root = "home/.agents/"
target = "~/.agents"
mode = "symlink"

[dotfile_groups.config]
root = "home/.config/"
target = "~/.config"
mode = "symlink"

[bootstrap.macos.dock]
autohide = true
autohide_delay = 0
tilesize = 48
show_recents = false
apps = [
  "/Applications/Helium.app",
  "/Applications/Rex Beta.app"
]

[bootstrap.macos.defaults."com.apple.dock"]
minimize-to-application = true

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
show_extensions_warning = false
sort_folders_first = true
preferred_view_style = "column"
save_new_documents_to_cloud = false

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = true
automatic_capitalization = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleInterfaceStyle = "Dark"
AppleShowAllExtensions = true
AppleSpacesSwitchOnActivate = false
NSAutomaticPeriodSubstitutionEnabled = false
SLSMenuBarUseBlurredAppearance = true

[bootstrap.user]
login_shell = "fish"

[bootstrap.hooks.post-defaults]
run = "killall Dock Finder SystemUIServer || true"

[tasks.bootstrap]
run = [
  "mkdir -p {{ vars.code_dir | regex_replace(pattern='^~(/|$)', rep=env.HOME ~ '/') | absolute | quote }}",
  "podman machine inspect >/dev/null 2>&1 || podman machine init",
  "podman machine inspect | jq -e '.[0].State == \"running\"' >/dev/null || podman machine start"
]

[tasks."apps:capture"]
description = "Save allowlisted macshot and Tailscale preferences to the repo"
run = "ruby scripts/bootstrap-apps.rb capture"

[tasks."apps:capture:preview"]
description = "Preview preference snapshot updates without saving"
run = "ruby scripts/bootstrap-apps.rb capture --dry-run"

[tasks."apps:apply"]
description = "Apply saved app preferences without launching apps"
run = "ruby scripts/bootstrap-apps.rb apply"

[tasks."apps:preview"]
description = "Preview saved preferences to apply without changing apps"
run = "ruby scripts/bootstrap-apps.rb apply --dry-run"

[tasks.check]
description = "Check shell syntax and Git diff whitespace without deploying"
run = [
  "bash -n install.sh",
  "ruby -c scripts/bootstrap-apps.rb",
  "ruby tests/bootstrap-apps.rb",
  "jq -e . home/.config/tinycast/settings.json settings/apps.json >/dev/null",
  "find home/.config/fish -name '*.fish' -type f -print0 | xargs -0 -n 1 fish --no-config --no-execute",
  "git diff --check",
  "git diff --cached --check"
]

[bootstrap.hooks.final]
run = '''mise run apps:apply
echo 'Manual steps'
if ! command -v rex >/dev/null 2>&1; then
  echo '  Install Rex'
  echo '  https://www.superlogical.com/rex'
fi
if command -v cua-driver >/dev/null 2>&1; then
  echo '  cua-driver permissions grant    # Accessibility + Screen Recording for Cua Driver'
  echo '  cua-driver permissions status   # verify the grants afterwards'
fi
'''

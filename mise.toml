# Machine setup for macOS, applied with `mise bootstrap`.
#
# Select this machine's profile in ./.miserc.local.toml (not committed):
#   env = ["personal"]   # or ["work"]
#
# See README.md for first-time setup and day-to-day commands.

# --- Dotfiles ----------------------------------------------------------------
# Link every git-tracked file under ./home into $HOME, file by file. Ignored
# files (app state, credentials, caches) are never linked, so apps write them
# into real directories in $HOME instead of into this repository.
[dotfiles."~"]
source = "home"
mode = "symlink-each"
manifest = "git"

# --- Login shell -------------------------------------------------------------
# mise activation lives in home/.config/fish/conf.d/mise.fish.
[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

# --- Packages ----------------------------------------------------------------
# mise installs these itself; Homebrew does not need to be installed.
[bootstrap.packages]
"brew:bat" = "latest"
"brew:eza" = "latest"
"brew:fd" = "latest"
"brew:fish" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:jq" = "latest"
"brew:lazygit" = "latest"
"brew:neovim" = "latest"
"brew:podman" = "latest"
"brew:starship" = "latest"
"brew:wget" = "latest"
"brew:xcodes" = "latest"
"brew:zoxide" = "latest"

"brew-cask:1password" = "latest"
"brew-cask:abue-ammar/tinycast/tinycast" = "latest"
"brew-cask:cuadriver" = "latest"
"brew-cask:figma" = "latest"
"brew-cask:font-fira-code" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:helium-browser" = "latest"
"brew-cask:anomalyco/tap/hex" = "latest"
"brew-cask:macshot" = "latest"
"brew-cask:nikitabobko/tap/aerospace" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:zed" = "latest"

# Profile: personal
"brew-cask:private-internet-access" = { env = "personal" }
"brew-cask:tailscale-app" = { env = "personal" }

# Profile: work
"brew-cask:slack" = { env = "work" }

# --- macOS preferences -------------------------------------------------------
[bootstrap.macos.dock]
autohide = true
magnification = true
tilesize = 44
largesize = 30
show_recents = false
# Finder is always pinned first by macOS, so it is not listed here.
apps = [
  "/Applications/Helium.app",
  "/Applications/Rex Beta.app",
]

[bootstrap.macos.finder]
preferred_view_style = "column"
show_pathbar = true
show_status_bar = true
sort_folders_first = true

[bootstrap.macos.keyboard]
initial_key_repeat = 15
key_repeat = 2
automatic_capitalization = true

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = false

[bootstrap.macos.defaults."com.apple.dock"]
minimize-to-application = true
wvous-br-corner = 14 # bottom-right hot corner: Quick Note

[bootstrap.macos.defaults."com.apple.finder"]
NewWindowTarget = "PfHm"
FXPreferredGroupBy = "Kind"
ShowHardDrivesOnDesktop = true
ShowExternalHardDrivesOnDesktop = true
ShowRemovableMediaOnDesktop = true
ShowMountedServersOnDesktop = true
ShowRecentTags = false
_FXSortFoldersFirstOnDesktop = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true
NSAutomaticPeriodSubstitutionEnabled = true
"com.apple.trackpad.forceClick" = true

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
TrackpadRightClick = true
TrackpadCornerSecondaryClick = 0
TrackpadScroll = true
TrackpadHorizScroll = true
TrackpadMomentumScroll = true
TrackpadPinch = true
TrackpadRotate = true
TrackpadThreeFingerTapGesture = 0
TrackpadTwoFingerDoubleTapGesture = 1
TrackpadTwoFingerFromRightEdgeSwipeGesture = 3
TrackpadThreeFingerHorizSwipeGesture = 2
TrackpadThreeFingerVertSwipeGesture = 2
TrackpadFourFingerHorizSwipeGesture = 2
TrackpadFourFingerVertSwipeGesture = 2
TrackpadFourFingerPinchGesture = 2
TrackpadFiveFingerPinchGesture = 2
USBMouseStopsTrackpad = false

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
TrackpadRightClick = true

[bootstrap.macos.defaults."com.apple.screencapture"]
type = "png"
disable-shadow = false
show-thumbnail = true

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.mouse.tapBehavior"
host = "current"
value = 1

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.trackpad.enableSecondaryClick"
host = "current"
value = true

# --- Imperative setup --------------------------------------------------------
# Runs last on every `mise bootstrap`, with [tools] available. Keep it idempotent.
[tasks.bootstrap]
description = "Setup that the declarative sections do not cover"
depends = ["setup:*"]

[tasks."setup:dirs"]
description = "Create home directories"
run = "mkdir -p ~/Developer ~/Screenshots"

[tasks."setup:macos"]
description = "Apply macOS settings that need runtime values, then restart UI apps"
depends = ["setup:dirs"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

defaults write com.apple.screencapture location -string "$HOME/Screenshots"

# Map Caps Lock to Escape now, and persist it for the built-in keyboard.
caps_lock=30064771129
escape=30064771113
hidutil property --set "{\"UserKeyMapping\":[{\"HIDKeyboardModifierMappingSrc\":$caps_lock,\"HIDKeyboardModifierMappingDst\":$escape}]}" >/dev/null

kbd="$(ioreg -r -c AppleHIDKeyboardEventDriverV2 -l 2>/dev/null || true)"
vendor_id="$(awk -F'= ' '/"VendorID" =/{print $2; exit}' <<<"$kbd")"
product_id="$(awk -F'= ' '/"ProductID" =/{print $2; exit}' <<<"$kbd")"
if [[ "$vendor_id" =~ ^[0-9]+$ && "$product_id" =~ ^[0-9]+$ ]]; then
  defaults -currentHost write NSGlobalDomain "com.apple.keyboard.modifiermapping.${vendor_id}-${product_id}-0" -array \
    "{ HIDKeyboardModifierMappingSrc = $caps_lock; HIDKeyboardModifierMappingDst = $escape; }"
else
  echo "warning: could not persist the Caps Lock mapping for the built-in keyboard" >&2
fi

killall Dock Finder SystemUIServer 2>/dev/null || true
'''

[tasks."setup:vite-plus"]
description = "Install Vite+ and point it at mise-managed runtimes"
run = '''
#!/usr/bin/env bash
set -euo pipefail
unset VP_HOME VP_BIN_DIR VP_DATA_DIR VP_CACHE_DIR

vp="$HOME/.local/share/vite-plus/bin/vp"
if [ ! -x "$vp" ]; then
  curl -fsSL https://vite.plus | VP_NODE_MANAGER=yes bash
fi
"$vp" env setup --refresh
"$vp" env off
'''

[tasks."setup:rex"]
description = "Install/update Rex's skill for pi and opencode"
run = '''
#!/usr/bin/env bash
set -euo pipefail

rex="$HOME/Library/Application Support/com.superlogical.rex/RexServer/Versions/Current/Rex Server.app/Contents/MacOS/rex"
command -v rex >/dev/null && rex="$(command -v rex)"
if [ ! -x "$rex" ]; then
  echo "skipping rex skill: install Rex from https://www.superlogical.com/rex first" >&2
  exit 0
fi
"$rex" skill setup --agent pi --agent opencode
'''

[tasks."setup:cua-driver"]
description = "Install Cua Driver's agent skill (used by pi via the CLI, no MCP)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

if ! command -v cua-driver >/dev/null; then
  echo "skipping cua-driver skill: cua-driver is not installed" >&2
  exit 0
fi
cua-driver mcp-config --client pi >/dev/null
cua-driver skills install
'''

[tasks."setup:skills"]
description = "Install/update agent skills from ~/.agents/.skill-lock.json"
run = '''
#!/usr/bin/env bash
set -euo pipefail

lock_file="$HOME/.agents/.skill-lock.json"
temp_lock="$HOME/skills-lock.json"
if [ ! -f "$lock_file" ]; then
  echo "skipping skills: $lock_file is missing" >&2
  exit 0
fi
if [ -e "$temp_lock" ]; then
  echo "$temp_lock already exists; move it and re-run" >&2
  exit 1
fi

trap 'rm -f "$temp_lock"' EXIT
cp "$lock_file" "$temp_lock"
cd "$HOME"
npx skills experimental_install
'''

# --- Upgrades ----------------------------------------------------------------
[tasks.upgrade]
description = "Pull dotfiles, upgrade packages/tools, and re-apply everything"
run = [
  "git pull --ff-only",
  "mise bootstrap packages upgrade --yes",
  "env -u VP_HOME -u VP_BIN_DIR -u VP_DATA_DIR -u VP_CACHE_DIR ~/.local/share/vite-plus/bin/vp upgrade",
  "mise self-update --yes",
  "mise upgrade",
  "mise bootstrap --yes",
]
